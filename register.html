<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | CaterPro</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="auth-page">

<a href="index.html"
class="auth-brand">

🍽️ CaterPro

</a>

<div class="auth-container single">

<form id="registerForm"
class="auth-card">

<span class="eyebrow">
CREATE ACCOUNT
</span>

<h2>
Create Account
</h2>

<p class="muted">
Register as a customer.
</p>

<div class="form-grid">

<label>

Full Name

<input
id="regName"
type="text"
required
>

</label>

<label>

Email

<input
id="regEmail"
type="email"
required
>

</label>

<label>

Phone

<input
id="regPhone"
type="tel"
pattern="[0-9]{10}"
required
>

</label>

<label>

Password

<input
id="regPassword"
type="password"
minlength="6"
required
>

</label>

<label>

Confirm Password

<input
id="regConfirm"
type="password"
required
>

</label>

</div>

<div id="registerMessage"
class="form-message hidden">
</div>

<button
type="submit"
class="btn btn-primary full">

Create Account

</button>

<p class="auth-link">

Already have an account?

<a href="login.html">
Login
</a>

</p>

</form>

</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
